<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Social Cleaner — privacy-first digital footprint audit</title>
  <desc id="desc">AMOLED-black banner with the Social Cleaner wordmark, product tagline, coverage chips, and a scan summary card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040504"/>
      <stop offset="0.55" stop-color="#080b09"/>
      <stop offset="1" stop-color="#0d1510"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9cf7c4"/>
      <stop offset="0.6" stop-color="#49e59a"/>
      <stop offset="1" stop-color="#1bbf78"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#49e59a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#49e59a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>
  <circle cx="1420" cy="40" r="360" fill="url(#glow)"/>
  <circle cx="180" cy="560" r="300" fill="url(#glow)" opacity="0.35"/>

  <g font-family="Manrope, Segoe UI, Arial, sans-serif">
    <g transform="translate(96 66)">
      <rect width="44" height="44" rx="13" fill="#0d1712" stroke="#28523d"/>
      <circle cx="22" cy="22" r="11" fill="none" stroke="#49e59a" stroke-width="2"/>
      <circle cx="22" cy="22" r="3.5" fill="#49e59a"/>
      <path d="M22 6v5M22 33v5M6 22h5M33 22h5" stroke="#49e59a" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="156" y="96" fill="#d9e5dd" font-size="18" font-weight="700" letter-spacing="4">SOCIAL CLEANER</text>
    <text x="1240" y="94" fill="#7d8e84" font-size="15" font-weight="700" letter-spacing="3">MIT · OPEN SOURCE</text>

    <text x="96" y="176" fill="#7df0b5" font-size="16" font-weight="800" letter-spacing="5.5">PRIVACY-FIRST DIGITAL FOOTPRINT AUDIT</text>
    <text x="92" y="284" fill="#f5f8f6" font-size="94" font-weight="800" letter-spacing="-5">SOCIAL</text>
    <text x="92" y="382" fill="url(#green)" font-size="94" font-weight="800" letter-spacing="-5">CLEANER</text>
    <text x="96" y="432" fill="#aebbb3" font-size="22" font-weight="500">Find your public accounts. Keep the evidence. Remove what you own.</text>

    <g font-size="14" font-weight="700" letter-spacing="1.4">
      <rect x="96" y="474" width="152" height="40" rx="20" fill="#0b120e" stroke="#264635"/>
      <text x="172" y="500" text-anchor="middle" fill="#9be8bd">115 PLATFORMS</text>
      <rect x="262" y="474" width="184" height="40" rx="20" fill="#0b120e" stroke="#264635"/>
      <text x="354" y="500" text-anchor="middle" fill="#9be8bd">56 DIRECT CHECKS</text>
      <rect x="460" y="474" width="166" height="40" rx="20" fill="#0b120e" stroke="#264635"/>
      <text x="543" y="500" text-anchor="middle" fill="#9be8bd">AES-256 VAULT</text>
    </g>

    <g transform="translate(872 94)">
      <rect width="632" height="384" rx="30" fill="#080b09" stroke="#1d3a2a" stroke-width="1.5"/>
      <rect x="1" y="1" width="630" height="382" rx="29" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>

      <text x="34" y="50" fill="#e8f2ec" font-size="18" font-weight="750" letter-spacing="1">SCAN SUMMARY</text>
      <rect x="486" y="26" width="112" height="34" rx="17" fill="#0d2118" stroke="#2b6d4c"/>
      <text x="542" y="48" text-anchor="middle" fill="#6ff0ae" font-size="12" font-weight="800" letter-spacing="1.5">LIVE</text>

      <g transform="translate(34 82)">
        <rect width="564" height="74" rx="18" fill="#0d120f" stroke="#1b3025"/>
        <circle cx="33" cy="37" r="9" fill="#49e59a" filter="url(#softGlow)"/>
        <text x="58" y="32" fill="#dce9e1" font-size="16" font-weight="650">Public profile checks</text>
        <text x="58" y="54" fill="#7e9186" font-size="13">Direct page evidence where available</text>
        <text x="532" y="43" text-anchor="end" fill="#8ef0b5" font-size="20" font-weight="800">56</text>
      </g>
      <g transform="translate(34 170)">
        <rect width="564" height="74" rx="18" fill="#0d120f" stroke="#1b3025"/>
        <circle cx="33" cy="37" r="9" fill="#d7b46a"/>
        <text x="58" y="32" fill="#dce9e1" font-size="16" font-weight="650">Manual verification</text>
        <text x="58" y="54" fill="#7e9186" font-size="13">Real profile links, never invented results</text>
        <text x="532" y="43" text-anchor="end" fill="#d7b46a" font-size="20" font-weight="800">59</text>
      </g>
      <g transform="translate(34 258)">
        <rect width="564" height="74" rx="18" fill="#0d120f" stroke="#1b3025"/>
        <circle cx="33" cy="37" r="9" fill="#7c8d84"/>
        <text x="58" y="32" fill="#dce9e1" font-size="16" font-weight="650">Blocked is not proof</text>
        <text x="58" y="54" fill="#7e9186" font-size="13">Login walls and CAPTCHAs never count as evidence</text>
        <text x="532" y="43" text-anchor="end" fill="#7c8d84" font-size="20" font-weight="800">0</text>
      </g>

      <g transform="translate(34 350)">
        <text x="0" y="0" fill="#7d8e84" font-size="12" font-weight="700" letter-spacing="1.5">EVIDENCE · CONSENT · OWNERSHIP</text>
        <text x="564" y="0" text-anchor="end" fill="#49e59a" font-size="12" font-weight="800" letter-spacing="1.5">SOCIAL-CLEANER</text>
      </g>
    </g>
  </g>
</svg>
